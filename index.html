<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>·</title>
<style>
  :root {
    --ink: #161615;
    --muted: #a0a098;
    --hair: #e6e6e2;
    --hair-strong: #cfcfc8;
    --font: -apple-system, "Helvetica Neue", "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: #fff;
    color: var(--ink);
    font-family: var(--font);
    -webkit-font-smoothing: antialiased;
    display: flex;
    flex-direction: column;
    min-height: 100%;
  }

  main {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: clamp(40px, 7vh, 90px) clamp(24px, 6vw, 80px);
  }

  .stack {
    width: 100%;
    max-width: 560px;
    display: flex;
    flex-direction: column;
    align-items: stretch;
    gap: clamp(26px, 4vh, 40px);
  }

  /* ── photo ── */
  .photo {
    position: relative;
    width: 100%;
    aspect-ratio: 3 / 2;
    max-height: 58vh;
    overflow: hidden;
    border-radius: 2px;
    background: #f1f1ec;
  }
  .photo img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    transition: transform .6s cubic-bezier(.2,.8,.2,1);
  }
  .photo:hover img { transform: scale(1.03); }

  /* ── minimal player ── */
  .player {
    display: flex;
    align-items: center;
    gap: 16px;
    width: 100%;
    user-select: none;
  }
  .play {
    flex: none;
    width: 30px;
    height: 30px;
    border: 0;
    background: none;
    padding: 0;
    cursor: pointer;
    color: var(--ink);
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: .85;
    transition: opacity .25s, transform .25s;
  }
  .play:hover { opacity: 1; }
  .play:active { transform: scale(.92); }
  .play svg { width: 100%; height: 100%; display: block; }
  .play .pause-icon { display: none; }
  .player.playing .play .play-icon { display: none; }
  .player.playing .play .pause-icon { display: block; }

  .track {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 9px;
  }
  .title {
    font-size: 11px;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .progress {
    position: relative;
    width: 100%;
    height: 16px;
    display: flex;
    align-items: center;
    cursor: pointer;
  }
  .progress .rail {
    position: absolute;
    left: 0; right: 0;
    height: 1.5px;
    background: var(--hair);
    border-radius: 2px;
  }
  .progress .fill {
    position: absolute;
    left: 0;
    height: 1.5px;
    width: 0%;
    background: var(--ink);
    border-radius: 2px;
  }
  .progress .knob {
    position: absolute;
    left: 0%;
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--ink);
    transform: translateX(-50%) scale(0);
    transition: transform .2s;
  }
  .progress:hover .knob { transform: translateX(-50%) scale(1); }

  footer {
    text-align: center;
    padding: 22px 0 30px;
    font-size: 11px;
    letter-spacing: .14em;
    color: var(--muted);
  }

  @media (max-width: 540px) {
    .stack { max-width: 360px; gap: 28px; }
  }
</style>
</head>
<body>
  <main>
    <div class="stack">

      <div class="photo">
        <img src="photo.jpg" alt="">
      </div>

      <div class="player" id="player">
        <button class="play" id="playBtn" aria-label="播放 / 暂停">
          <svg class="play-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round">
            <path d="M8 5.5 L18 12 L8 18.5 Z"></path>
          </svg>
          <svg class="pause-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round">
            <line x1="9" y1="5.5" x2="9" y2="18.5"></line>
            <line x1="15" y1="5.5" x2="15" y2="18.5"></line>
          </svg>
        </button>
        <div class="track">
          <span class="title">暗涌 — 王菲</span>
          <div class="progress" id="progress">
            <div class="rail"></div>
            <div class="fill" id="fill"></div>
            <div class="knob" id="knob"></div>
          </div>
        </div>
      </div>

      <audio id="audio" src="track.mp3" preload="metadata"></audio>
    </div>
  </main>
  <footer>© 2026</footer>

<script>
(function () {
  var player = document.getElementById('player');
  var audio = document.getElementById('audio');
  var playBtn = document.getElementById('playBtn');
  var progress = document.getElementById('progress');
  var fill = document.getElementById('fill');
  var knob = document.getElementById('knob');

  // silent on load — play only on click
  playBtn.addEventListener('click', function () {
    if (audio.paused) audio.play(); else audio.pause();
  });
  audio.addEventListener('play', function () { player.classList.add('playing'); });
  audio.addEventListener('pause', function () { player.classList.remove('playing'); });
  audio.addEventListener('ended', function () { player.classList.remove('playing'); });

  audio.addEventListener('timeupdate', function () {
    if (!audio.duration) return;
    var p = (audio.currentTime / audio.duration) * 100;
    fill.style.width = p + '%';
    knob.style.left = p + '%';
  });

  progress.addEventListener('click', function (e) {
    if (!audio.duration) return;
    var r = progress.getBoundingClientRect();
    var ratio = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width));
    audio.currentTime = ratio * audio.duration;
  });
})();
</script>
</body>
</html>
