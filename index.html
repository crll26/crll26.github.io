<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500&display=swap" rel="stylesheet">
<style>
html,body{margin:0;padding:0;background:#F7F3EB;}
body{font-family:'Noto Sans SC','Helvetica Neue',Helvetica,system-ui,sans-serif;font-weight:400;color:#22201C;-webkit-font-smoothing:antialiased;}
a{color:#22201C;text-decoration:none;border-bottom:1px solid rgba(34,32,28,.3);}
a:hover{color:#B03A2E;border-bottom-color:#B03A2E;}
::selection{background:rgba(176,58,46,.16);}
*{-webkit-tap-highlight-color:transparent;}
</style>
</helmet>
<div style="min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:clamp(28px,7vh,72px) 24px clamp(24px,5vh,48px);box-sizing:border-box;gap:36px;">

  <div style="width:100%;max-width:520px;display:flex;flex-direction:column;gap:26px;">
    <div style="display:flex;align-items:baseline;justify-content:space-between;">
      <span style="font-size:12px;letter-spacing:5px;color:#8A8378;">PLAYER</span>
      <span style="font-size:11px;letter-spacing:3px;color:#B0A99C;">{{ countLabel }}</span>
    </div>

    <div style="display:flex;flex-direction:column;">
      <sc-for list="{{ rows }}" as="row" hint-placeholder-count="4">
        <div style="{{ row.style }}" onClick="{{ row.click }}" onMouseEnter="{{ row.enter }}" onMouseLeave="{{ row.leave }}">
          <span style="{{ row.numStyle }}">{{ row.num }}</span>
          <span style="{{ row.titleStyle }}">{{ row.title }}</span>
          <span style="{{ row.artistStyle }}">{{ row.artist }}</span>
          <span style="{{ row.durStyle }}">{{ row.dur }}</span>
        </div>
      </sc-for>
    </div>
  </div>

  <div style="width:100%;max-width:520px;display:flex;flex-direction:column;gap:14px;">
    <div style="display:flex;align-items:baseline;justify-content:space-between;gap:16px;">
      <span style="font-size:10px;font-weight:500;letter-spacing:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">{{ nowLine }}</span>
      <span style="font-size:10px;letter-spacing:1px;color:#8A8378;font-variant-numeric:tabular-nums;flex:none;">{{ timeLine }}</span>
    </div>

    <div style="padding:9px 0;cursor:pointer;touch-action:none;" onPointerDown="{{ seekDown }}">
      <div style="position:relative;height:1px;background:rgba(34,32,28,.18);">
        <div style="{{ fillStyle }}"></div>
        <div style="{{ knobStyle }}"></div>
      </div>
    </div>

    <div style="display:flex;align-items:center;gap:26px;">
      <span style="{{ ctrlStyle }}" onClick="{{ prev }}">❮❮</span>
      <span style="{{ playStyle }}" onClick="{{ toggle }}">{{ playGlyph }}</span>
      <span style="{{ ctrlStyle }}" onClick="{{ next }}">❯❯</span>
      <span style="flex:1;"></span>
      <span style="{{ loopStyle }}" onClick="{{ toggleLoop }}">{{ loopLabel }}</span>
    </div>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;accent&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#B03A2E&quot;,&quot;options&quot;:[&quot;#B03A2E&quot;,&quot;#22201C&quot;,&quot;#2C5F7C&quot;,&quot;#4A6B4F&quot;],&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;样式&quot;},&quot;dense&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;样式&quot;}}">
const TRACKS = [
  { title: '暗涌', artist: '王菲', src: 'music/anyong-faye-wong.mp3' }
];

class Component extends DCLogic {
  state = { cur: 0, playing: false, t: 0, durs: {}, hover: -1, loop: false, dragging: false };

  componentDidMount() {
    this.audio = new Audio();
    this.audio.preload = 'metadata';
    this.audio.src = TRACKS[0].src;
    this.audio.addEventListener('timeupdate', () => { if (!this.state.dragging) this.setState({ t: this.audio.currentTime }); });
    this.audio.addEventListener('loadedmetadata', () => this.setState(s => ({ durs: { ...s.durs, [s.cur]: this.audio.duration || 0 } })));
    this.audio.addEventListener('play', () => this.setState({ playing: true }));
    this.audio.addEventListener('pause', () => this.setState({ playing: false }));
    this.audio.addEventListener('ended', () => {
      if (this.state.loop) { this.audio.currentTime = 0; this.audio.play().catch(() => {}); }
      else this.next();
    });
    try { const p = +localStorage.getItem('playerPos'); if (p > 0) this.audio.currentTime = p; } catch (e) {}
    this.saver = setInterval(() => {
      try { if (this.audio && this.audio.currentTime) localStorage.setItem('playerPos', this.audio.currentTime); } catch (e) {}
    }, 3000);
    this.onKey = e => {
      if (e.key === ' ') { this.toggle(); e.preventDefault(); }
      else if (e.key === 'ArrowRight') this.next();
      else if (e.key === 'ArrowLeft') this.prev();
    };
    window.addEventListener('keydown', this.onKey);
  }
  componentWillUnmount() {
    window.removeEventListener('keydown', this.onKey);
    clearInterval(this.saver);
    if (this.audio) this.audio.pause();
  }

  play = i => {
    if (!this.audio) return;
    if (i !== this.state.cur) {
      this.audio.src = TRACKS[i].src;
      this.setState({ cur: i, t: 0 });
    }
    this.audio.play().catch(() => {});
  };
  toggle = () => {
    if (!this.audio) return;
    if (this.audio.paused) this.audio.play().catch(() => {}); else this.audio.pause();
  };
  next = () => this.play((this.state.cur + 1) % TRACKS.length);
  prev = () => {
    if (this.audio && this.audio.currentTime > 3) { this.audio.currentTime = 0; return; }
    this.play((this.state.cur - 1 + TRACKS.length) % TRACKS.length);
  };

  seekDown = e => {
    if (!this.audio) return;
    const box = e.currentTarget.getBoundingClientRect();
    const dur = this.state.durs[this.state.cur] || this.audio.duration || 0;
    if (!dur) return;
    const at = ev => {
      const r = Math.min(1, Math.max(0, (ev.clientX - box.left) / box.width));
      this.setState({ t: r * dur });
      return r * dur;
    };
    this.setState({ dragging: true });
    at(e);
    const move = ev => at(ev);
    const up = ev => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
      this.audio.currentTime = at(ev);
      this.setState({ dragging: false });
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };

  fmt(s) {
    if (!isFinite(s) || s < 0) s = 0;
    return Math.floor(s / 60) + ':' + String(Math.floor(s % 60)).padStart(2, '0');
  }

  renderVals() {
    const s = this.state;
    const accent = this.props.accent ?? '#B03A2E';
    const dense = this.props.dense ?? false;
    const dur = s.durs[s.cur] || 0;
    const pct = dur ? Math.min(100, (s.t / dur) * 100) : 0;
    const track = TRACKS[s.cur];

    const rows = TRACKS.map((t, i) => {
      const on = i === s.cur;
      const hov = i === s.hover;
      return {
        num: String(i + 1).padStart(2, '0'),
        title: t.title,
        artist: t.artist,
        dur: s.durs[i] ? this.fmt(s.durs[i]) : '—',
        click: () => (on ? this.toggle() : this.play(i)),
        enter: () => this.setState({ hover: i }),
        leave: () => this.setState({ hover: -1 }),
        style: {
          display: 'grid', gridTemplateColumns: '28px 1fr auto 46px', alignItems: 'baseline',
          gap: '14px', padding: dense ? '10px 0' : '15px 0', cursor: 'pointer',
          borderTop: '1px solid ' + (i === 0 ? 'rgba(34,32,28,.22)' : 'rgba(34,32,28,.09)'),
          transition: 'opacity .2s'
        },
        numStyle: { fontSize: '11px', letterSpacing: '1px', color: on ? accent : (hov ? '#8A8378' : '#C6BFB2'), fontVariantNumeric: 'tabular-nums' },
        titleStyle: { fontSize: '10px', fontWeight: on ? 500 : 400, letterSpacing: '1px', color: on ? accent : '#22201C', whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' },
        artistStyle: { fontSize: '10px', letterSpacing: '1px', color: on ? accent : '#8A8378', opacity: on ? 0.85 : 1 },
        durStyle: { fontSize: '10px', letterSpacing: '1px', color: '#8A8378', textAlign: 'right', fontVariantNumeric: 'tabular-nums' }
      };
    });

    const ctrl = { fontSize: '11px', letterSpacing: '1px', color: '#8A8378', cursor: 'pointer', userSelect: 'none', transition: 'color .2s' };

    return {
      rows,
      countLabel: TRACKS.length + ' 首',
      nowLine: track.title + ' — ' + track.artist,
      timeLine: this.fmt(s.t) + ' / ' + (dur ? this.fmt(dur) : '—:—'),
      playGlyph: s.playing ? '❙❙' : '❯',
      fillStyle: { position: 'absolute', left: 0, top: 0, height: '1px', width: pct + '%', background: accent, transition: s.dragging ? 'none' : 'width .2s linear' },
      knobStyle: { position: 'absolute', top: '-2.5px', left: pct + '%', width: '6px', height: '6px', marginLeft: '-3px', borderRadius: '50%', background: accent, transition: s.dragging ? 'none' : 'left .2s linear' },
      ctrlStyle: ctrl,
      playStyle: { ...ctrl, fontSize: '13px', color: '#22201C', minWidth: '16px' },
      loopStyle: { ...ctrl, color: s.loop ? accent : '#8A8378', opacity: s.loop ? 1 : 0.85 },
      loopLabel: '单曲循环',
      toggleLoop: () => this.setState(p => ({ loop: !p.loop })),
      toggle: this.toggle, next: this.next, prev: this.prev, seekDown: this.seekDown
    };
  }
}

</script>
</body>
</html>
